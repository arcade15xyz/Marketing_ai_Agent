[project]
name = "aosp-marketing-agents"
version = "0.1.0"
description = "Markdown-only multi-agent content pipeline for AOSP engineering marketing."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "anthropic>=1,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
    "python-dotenv>=1,<2",
    "pydantic>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

